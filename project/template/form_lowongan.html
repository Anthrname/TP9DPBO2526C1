<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Form Lowongan Pekerjaan</title>
  <style>
    :root{
      --bg: #f7f8fb;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e6e9ef;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#0f172a;}
    .container{max-width:650px;margin:36px auto;padding:18px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow: 0 1px 3px rgba(16,24,40,0.04);}
    .nav-bar{display:flex;gap:10px;margin-bottom:18px;border-bottom:2px solid var(--border);padding-bottom:10px;}
    .nav-link{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 14px;border-radius:6px;transition:all 0.2s;}
    .nav-link:hover{color:var(--accent);background:rgba(37,99,235,0.05);}
    .nav-link.active{color:var(--accent);background:#eff6ff;}
    h1{margin:0 0 16px;font-size:20px;color:#0f172a;}
    form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;}
    input[type="text"], input[type="number"], select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;}
    .full{grid-column:1/-1;}
    .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;}
    .btn{padding:9px 16px;border-radius:6px;border:1px solid transparent;font-size:14px;cursor:pointer;text-decoration:none;}
    .btn-primary{background:var(--accent);color:#fff;font-weight:600;}
    .btn-muted{background:transparent;border:1px solid var(--border);color:var(--muted);}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <nav class="nav-bar">
        <a href="index.php" class="nav-link">👥 Daftar Kandidat</a>
        <a href="lowongan.php" class="nav-link active">💼 Lowongan Pekerjaan</a>
      </nav>

      <h1>{{FORM_TITLE}}</h1>

      <form method="post" action="lowongan.php">
        <input type="hidden" name="action" value="{{ACTION}}">
        <input type="hidden" name="id" value="{{ID}}">

        <div class="full">
          <label for="namaLowongan">Nama / Judul Lowongan</label>
          <input id="namaLowongan" name="namaLowongan" type="text" placeholder="Misal: Senior Backend Developer" value="{{NAMA_LOWONGAN}}" required>
        </div>

        <div>
          <label for="departemen">Departemen</label>
          <input id="departemen" name="departemen" type="text" placeholder="Misal: Engineering" value="{{DEPARTEMEN}}" required>
        </div>

        <div>
          <label for="tipePekerjaan">Tipe Pekerjaan</label>
          <select id="tipePekerjaan" name="tipePekerjaan" required>
            <option value="Full-time" {{TIPE_FULLTIME}}>Full-time</option>
            <option value="Part-time" {{TIPE_PARTTIME}}>Part-time</option>
            <option value="Contract" {{TIPE_CONTRACT}}>Contract</option>
            <option value="Remote" {{TIPE_REMOTE}}>Remote</option>
            <option value="Internship" {{TIPE_INTERNSHIP}}>Internship</option>
          </select>
        </div>

        <div>
          <label for="kuota">Kuota Penerimaan (Orang)</label>
          <input id="kuota" name="kuota" type="number" min="1" step="1" value="{{KUOTA}}" required>
        </div>

        <div>
          <label for="status">Status Lowongan</label>
          <select id="status" name="status" required>
            <option value="Dibuka" {{STATUS_DIBUKA}}>Dibuka</option>
            <option value="Ditutup" {{STATUS_DITUTUP}}>Ditutup</option>
          </select>
        </div>

        <div class="full actions">
          <a href="lowongan.php" class="btn btn-muted">Batal</a>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
